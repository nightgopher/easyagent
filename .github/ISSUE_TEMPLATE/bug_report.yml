name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 issue，避免重复。
        日志与截图请先脱敏：移除 API Key、token、配对码、内网地址和本机个人路径。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么？期望的正确行为是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从干净状态开始的操作序列；无法稳定复现时写明大致频率。
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 影响组件
      options:
        - 桌面客户端（macOS / Linux 原生）
        - Android 客户端
        - Web 工作区（serve）
        - 终端 TUI / CLI
        - 飞书桥接
        - 服务端 deb / 部署
        - Go SDK
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release tag（如 v0.26.1）或 commit SHA；开发构建请注明。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 已脱敏的报错或日志片段；没有可留空。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 运行环境（OS / Android 版本）、配置差异、 workaround 等。
