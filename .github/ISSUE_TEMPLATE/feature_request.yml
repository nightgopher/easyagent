name: 功能建议
description: 提议一个新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 场景
      description: 现状哪里不满足？谁在什么场景下需要它？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或接口；能给出验收标准更好。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他做法及不选的原因；没有可留空。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、参考实现、相关 issue 链接等。
