name: Android UI
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile-native/**'
      - 'scripts/check-android-ui.sh'
      - 'internal/server/**'
      - '.github/workflows/android-ui.yml'
      - '!**/README*.md'
permissions:
  contents: read
concurrency:
  group: android-ui-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app has no Play Services dependency. Use AOSP on older APIs
          # to avoid first-boot Google app updates competing with UI tests,
          # and retain Google APIs compatibility coverage on the latest API.
          - api: 31
            target: default
          - api: 34
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Persist incremental build results for consecutive PR pushes; tag
          # builds only read caches, since their immutable refs are not reused.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs alongside emulator preparation
        run: |
          # Complete SDK writes before either Gradle or the emulator action uses it.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          (result=0; bash scripts/check-android-ui.sh --prepare > "$RUNNER_TEMP/android-build.log" 2>&1 || result=$?; echo "$result" > "$RUNNER_TEMP/android-build.exit") &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Compile SDK is 35 for every job; only the device image varies.
          api-level: 35
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          disable-animations: true
          working-directory: mobile-native
          # Overlap compilation with SDK/image downloads, not Android boot:
          # cold Kotlin compilation can starve Pixel Launcher and trigger an
          # ANR dialog that covers the app throughout the instrumentation suite.
          pre-emulator-launch-script: |
            timeout 900 bash -c 'until test -f "$RUNNER_TEMP/android-build.exit"; do sleep 1; done'; cat "$RUNNER_TEMP/android-build.log"; test "$(cat "$RUNNER_TEMP/android-build.exit")" = 0
          script: |
            test "$(cat "$RUNNER_TEMP/android-build.exit")" = 0
            adb shell svc power stayon true
            result=0; bash ../scripts/check-android-ui.sh --test || result=$?; adb pull /data/local/tmp/easyagent-ui app/build/qa || true; exit "$result"
      - name: Preserve background build diagnostics
        if: always()
        run: |
          cat "$RUNNER_TEMP/android-build.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-ui-api-${{ matrix.api }}
          path: |
            mobile-native/app/build/reports/androidTests
            mobile-native/app/build/outputs/androidTest-results
            mobile-native/app/build/qa
            ${{ runner.temp }}/android-build.log
