name: Android UI
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile-native/**'
      - 'scripts/check-android-ui.sh'
      - 'internal/server/**'
      - '.github/workflows/android-ui.yml'
permissions:
  contents: read
jobs:
  android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [31, 34, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'mobile-native/**/*.gradle*'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan
          disable-animations: true
          working-directory: mobile-native
          script: |
            bash ../scripts/check-android-ui.sh
            adb pull /data/local/tmp/easyagent-ui app/build/qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-api-${{ matrix.api }}
          path: |
            mobile-native/app/build/reports/androidTests
            mobile-native/app/build/outputs/androidTest-results
            mobile-native/app/build/qa
