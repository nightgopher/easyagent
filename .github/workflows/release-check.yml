name: Release build check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'scripts/release.py'
      - 'scripts/publish-release.py'
      - 'scripts/build-release.sh'
      - 'scripts/check-release-build.sh'
      - 'scripts/test_cua_helper.py'
      - 'native/computer-use/**'
      - 'scripts/test_release*.py'
      - 'desktop-native/**'
      - 'scripts/build-native.sh'
      - 'scripts/check-native-release-build.sh'
      - 'CHANGELOG.md'
      - 'cmd/easyagent*/**'
permissions:
  contents: read
jobs:
  release-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/check-release-build.sh
  native-build:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-native/go.mod
      - name: Exercise the native release builder
        run: bash scripts/check-native-release-build.sh
  signing-certificate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop-native/go.mod
      - name: Verify the configured release certificate without publishing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 ../scripts/macos-signing.py -- go run ./tools/build
        working-directory: desktop-native
