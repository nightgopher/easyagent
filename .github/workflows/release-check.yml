name: Encrypted backup signing bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Encrypt signing credentials for backup Mac
        shell: bash
        env:
          DESTINATION_PUBLIC_KEY_B64: ""
          EXPECTED_UPDATER_PUBLIC_KEY: "pxQjBGbExbXH4XixmVwcNNdNPFPHtzz5SoawM85L9JA="
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          python3 - <<'PYCODE'
          import base64,json,os,subprocess
          root=os.environ['RUNNER_TEMP'];pub=os.path.join(root,'backup-public.pem')
          with open(pub,'wb') as out:out.write(base64.b64decode(os.environ['DESTINATION_PUBLIC_KEY_B64'],validate=True))
          raw_key=base64.b64decode(os.environ['MYGO_UPDATER_PRIVATE_KEY'].strip(),validate=True)
          if len(raw_key)!=64 or base64.b64encode(raw_key[32:]).decode()!=os.environ['EXPECTED_UPDATER_PUBLIC_KEY']:
              raise RuntimeError('update signing key does not match the EasyAgent public key')
          sealed={}
          for name in ('MACOS_CERTIFICATE','MACOS_CERTIFICATE_PASSWORD','MYGO_UPDATER_PRIVATE_KEY'):
              msg=os.environ[name].encode()
              if not msg or len(msg)>262144:raise RuntimeError('missing or invalid credential: '+name)
              pieces=[]
              for offset in range(0,len(msg),256):
                  cmd=['openssl','pkeyutl','-encrypt','-pubin','-inkey',pub,'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256']
                  result=subprocess.run(cmd,input=msg[offset:offset+256],capture_output=True,check=True)
                  pieces.append(base64.b64encode(result.stdout).decode())
              sealed[name]=pieces
          fd=os.open(os.path.join(root,'backup-signing-sealed.json'),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as out:json.dump(sealed,out)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-signing-credentials
          path: ${{ runner.temp }}/backup-signing-sealed.json
          if-no-files-found: error
          retention-days: 1
