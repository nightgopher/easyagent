name: Encrypted gateway notarization transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Ensure libsodium is available
        shell: bash
        run: |
          if ! python3 -c 'import ctypes.util,sys; sys.exit(0 if ctypes.util.find_library("sodium") else 1)'; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libsodium-dev
          fi
      - name: Seal credentials to EasyGateway repository public key
        shell: bash
        env:
          DESTINATION_PUBLIC_KEY: "HyqwKhe/DMZnmq455jtAcuZcJIfVSyXCUv74oc4DEzA="
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64, ctypes, ctypes.util, json, os
          lib=ctypes.CDLL(ctypes.util.find_library('sodium'))
          lib.sodium_init.restype=ctypes.c_int
          if lib.sodium_init()<0: raise RuntimeError('sodium unavailable')
          lib.crypto_box_seal.argtypes=[ctypes.c_void_p,ctypes.c_void_p,ctypes.c_ulonglong,ctypes.c_void_p]
          lib.crypto_box_seal.restype=ctypes.c_int
          pub=base64.b64decode(os.environ['DESTINATION_PUBLIC_KEY'],validate=True)
          if len(pub)!=32: raise RuntimeError('invalid destination public key')
          pkbuf=ctypes.create_string_buffer(pub,32)
          result={}
          for name in ('APPLE_ID','APPLE_TEAM_ID','APPLE_APP_SPECIFIC_PASSWORD'):
              msg=os.environ[name].encode()
              if not msg or len(msg)>65536: raise RuntimeError('missing or invalid credential: '+name)
              sealed=ctypes.create_string_buffer(len(msg)+48)
              if lib.crypto_box_seal(sealed,ctypes.create_string_buffer(msg,len(msg)),len(msg),pkbuf)!=0: raise RuntimeError('encryption failed')
              result[name]=base64.b64encode(sealed.raw).decode()
          fd=os.open(os.path.join(os.environ['RUNNER_TEMP'],'gateway-sealed.json'),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as out: json.dump(result,out)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-gateway-notary-credentials
          path: ${{ runner.temp }}/gateway-sealed.json
          if-no-files-found: error
          retention-days: 1
