name: Encrypted backup notary bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Encrypt notarization credentials for backup Mac
        shell: bash
        env:
          DESTINATION_PUBLIC_KEY_B64: ""
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 - <<'PYCODE'
          import base64,json,os,subprocess
          root=os.environ['RUNNER_TEMP']
          pub=os.path.join(root,'backup-public.pem')
          with open(pub,'wb') as out:out.write(base64.b64decode(os.environ['DESTINATION_PUBLIC_KEY_B64'],validate=True))
          sealed={}
          for name in ('APPLE_ID','APPLE_TEAM_ID','APPLE_APP_SPECIFIC_PASSWORD'):
              msg=os.environ[name].encode()
              if not msg or len(msg)>300:raise RuntimeError('missing or invalid credential: '+name)
              cmd=['openssl','pkeyutl','-encrypt','-pubin','-inkey',pub,'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256']
              result=subprocess.run(cmd,input=msg,capture_output=True,check=True)
              sealed[name]=base64.b64encode(result.stdout).decode()
          fd=os.open(os.path.join(root,'backup-notary-sealed.json'),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as out:json.dump(sealed,out)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-notary-credentials
          path: ${{ runner.temp }}/backup-notary-sealed.json
          if-no-files-found: error
          retention-days: 1
