name: Release build check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'scripts/release.py'
      - 'scripts/publish-release.py'
      - 'scripts/build-release.sh'
      - 'scripts/build-android.py'
      - 'mobile-native/**'
      - 'scripts/check-release-build.sh'
      - 'scripts/test_cua_helper.py'
      - 'native/computer-use/**'
      - 'scripts/test_release*.py'
      - 'desktop-native/**'
      - 'scripts/build-native.sh'
      - 'scripts/check-native-release-build.sh'
      - 'cmd/easyagent*/**'
      - '!**/README*.md'
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            artifact: linux-amd64
          - target: linux/arm64
            artifact: linux-arm64
          - target: darwin/amd64
            artifact: darwin-amd64
          - target: darwin/arm64
            artifact: darwin-arm64
          - target: windows/amd64
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash scripts/check-release-build.sh '${{ matrix.target }}' "$RUNNER_TEMP/core-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: core-check-${{ matrix.artifact }}
          path: ${{ runner.temp }}/core-dist/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  core-manifest:
    needs: release-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: core-check-*
          merge-multiple: true
          path: ${{ runner.temp }}/core-dist
      - run: |
          chmod +x "$RUNNER_TEMP"/core-dist/easyagent-{linux,darwin}-* "$RUNNER_TEMP"/core-dist/easyagent-bridge-* \
            "$RUNNER_TEMP"/core-dist/easyagent-windows-amd64.exe "$RUNNER_TEMP"/core-dist/easyagent-bridge-windows-amd64.exe
          bash scripts/check-release-build.sh --assemble "$RUNNER_TEMP/core-dist"
  native-build:
    if: github.event_name == 'pull_request'
    # This job runs the full desktop-native UI preview suite, which spawns
    # many concurrent WKWebView instances. That needs an unattended GUI
    # session: on a self-hosted runner sharing the maintainer's active login
    # session the preview windows contend with real use and time out, so this
    # job always stays on hosted Apple Silicon regardless of
    # EASYAGENT_MACOS_ARM_RUNNER (release.yml native keeps using that var; it
    # builds, signs and smoke-checks one bundle without the UI suite).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop-native/go.mod
          cache-dependency-path: |
            go.sum
            desktop-native/go.sum
      - name: Exercise the native release builder
        run: bash scripts/check-native-release-build.sh
  android-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Persist incremental build results for consecutive PR pushes; tag
          # builds only read caches, since their immutable refs are not reused.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
      - name: Install the pinned Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
      - name: Exercise the release APK builder with a disposable signing key
        run: python3 scripts/build-android.py build dist --test-signing
  signing-certificate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.EASYAGENT_MACOS_ARM_RUNNER == 'macos-15' && 'macos-15' || vars.EASYAGENT_MACOS_ARM_RUNNER == 'xcode-27' && 'xcode-27' || vars.EASYAGENT_MACOS_ARM_RUNNER == 'macos-26' && 'macos-26' || (vars.EASYAGENT_MACOS_ARM_RUNNER != '' && vars.EASYAGENT_MACOS_ARM_RUNNER || 'macos-26') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop-native/go.mod
          cache-dependency-path: |
            go.sum
            desktop-native/go.sum
      - name: Verify the configured release certificate without publishing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 ../scripts/macos-signing.py -- go run ./tools/build
        working-directory: desktop-native
      - name: Verify the packaged core
        env:
          EASYAGENT_TEST_BUNDLE: ${{ github.workspace }}/desktop-native/build.noindex/darwin-arm64/EasyAgent.app
        run: go test -count=1 -run '^TestPackagedCoreSmoke$' .
        working-directory: desktop-native
      - name: Notarize the main preview installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMGS=(desktop-native/build.noindex/darwin-arm64/*.dmg)
          test "${#DMGS[@]}" -eq 1
          DMG="${DMGS[0]}"
          xcrun notarytool store-credentials "easyagent-preview-notary" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun notarytool submit "$DMG" --keychain-profile "easyagent-preview-notary" --wait
          # Retry only transient ticket-download errors after Apple accepted
          # the submission; rejection, signing and validation failures stop.
          for attempt in 1 2 3; do
            if output=$(xcrun stapler staple "$DMG" 2>&1); then
              printf '%s\n' "$output"
              break
            else
              status=$?
              printf '%s\n' "$output" >&2
            fi
            if (( attempt == 3 )) || ! grep -Eq 'NSURLErrorDomain Code=-(1001|1005|1009)([^0-9]|$)' <<< "$output"; then
              exit "$status"
            fi
            sleep "$((attempt * 5))"
          done
          xcrun stapler validate "$DMG"
          git rev-parse HEAD > desktop-native/build.noindex/darwin-arm64/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: signed-native-preview
          path: |
            desktop-native/build.noindex/darwin-arm64/*.dmg
            desktop-native/build.noindex/darwin-arm64/source-commit.txt
          if-no-files-found: error
          retention-days: 7
