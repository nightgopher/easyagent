name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated tag, e.g. v0.2.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
# Serialize publication; do not cancel a run while uploading assets.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
      sha: ${{ steps.policy.outputs.sha }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: policy
        name: Validate exact tag, ancestry, version and release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate "$TAG" --output "$GITHUB_OUTPUT"
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  android-ui:
    needs: validate
    uses: ./.github/workflows/android-ui.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  core:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build core payloads from exact revision
        env:
          TAG: ${{ needs.validate.outputs.version }}
        run: bash scripts/build-release.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-core
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  native:
    needs: [validate, core]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and validate the MyGo native installer
        env:
          TAG: ${{ needs.validate.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          python3 scripts/check-native-keychain.py
          bash scripts/build-native.sh darwin-arm64 native-dist "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-native
          path: native-dist/*
          if-no-files-found: error
          retention-days: 3
  native-linux:
    needs: [validate, core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and validate the Linux native packages
        env:
          TAG: ${{ needs.validate.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          # Stage outside the repository: the second build's clean-checkout
          # would reject the first build's untracked artifacts otherwise.
          bash scripts/build-native.sh linux-amd64 /tmp/native-dist "$TAG"
          bash scripts/build-native.sh linux-arm64 /tmp/native-dist "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-linux
          path: /tmp/native-dist/*
          if-no-files-found: error
          retention-days: 3
  android:
    needs: [validate, verify, android-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile-native/**/*.gradle.kts
            mobile-native/gradle/wrapper/gradle-wrapper.properties
      - name: Install the pinned Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build and verify the signed Android APK
        env:
          TAG: ${{ needs.validate.outputs.version }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/build-android.py build dist --version "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [validate, core, native, native-linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble complete manifest and verify every asset
        run: |
          python3 scripts/release.py validate "$TAG"
          python3 scripts/release.py manifest "$TAG" "$RELEASE_SHA" dist
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish complete draft without replacing published assets
        run: python3 scripts/publish-release.py "$TAG" "$RELEASE_SHA" dist
