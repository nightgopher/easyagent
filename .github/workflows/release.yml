name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated tag, e.g. v0.2.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
# Serialize publication; do not cancel a run while uploading assets.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.policy.outputs.version }}
      sha: ${{ steps.policy.outputs.sha }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: policy
        name: Validate exact tag, ancestry, version and release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py validate "$TAG" --output "$GITHUB_OUTPUT"
  verify:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  android-ui:
    needs: validate
    uses: ./.github/workflows/android-ui.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  core:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            artifact: linux-amd64
          - target: linux/arm64
            artifact: linux-arm64
          - target: darwin/amd64
            artifact: darwin-amd64
          - target: darwin/arm64
            artifact: darwin-arm64
          - target: windows/amd64
            artifact: windows-amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build core payloads from exact revision
        env:
          TAG: ${{ needs.validate.outputs.version }}
        run: bash scripts/build-release.sh "$TAG" '${{ matrix.target }}'
      - uses: actions/upload-artifact@v7
        with:
          name: release-core-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
  native-windows:
    needs: validate
    # The NSIS installer is built on Windows only (MyGo downloads NSIS there);
    # cross builds from Linux skip the installer, so this job must be a
    # Windows host. Git Bash provides the POSIX shell the script needs.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop-native/go.mod
          cache-dependency-path: |
            go.sum
            desktop-native/go.sum
      - name: Build and validate the Windows native installer
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bash scripts/build-native.sh windows-amd64 native-dist "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-native-windows
          path: native-dist/*
          if-no-files-found: error
          retention-days: 3
  native:
    needs: validate
    # Hosted Apple Silicon labels keep their semantics; any other non-empty
    # value is used verbatim as a runner label (e.g. a self-hosted Mac).
    # Empty falls back to the hosted default, macos-26.
    runs-on: ${{ vars.EASYAGENT_MACOS_ARM_RUNNER == 'macos-15' && 'macos-15' || vars.EASYAGENT_MACOS_ARM_RUNNER == 'xcode-27' && 'xcode-27' || vars.EASYAGENT_MACOS_ARM_RUNNER == 'macos-26' && 'macos-26' || (vars.EASYAGENT_MACOS_ARM_RUNNER != '' && vars.EASYAGENT_MACOS_ARM_RUNNER || 'macos-26') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop-native/go.mod
          cache-dependency-path: |
            go.sum
            desktop-native/go.sum
      - name: Build and validate the MyGo native installer
        env:
          TAG: ${{ needs.validate.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          python3 scripts/check-native-keychain.py
          bash scripts/build-native.sh darwin-arm64 native-dist "$TAG"
      - name: Notarize the macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="native-dist/easyagent-native-darwin-arm64.dmg"
          # Keyless submission: notarytool store-credentials needs a writable
          # default keychain, which is locked on self-hosted runner sessions.
          # Explicit credentials avoid the keychain entirely; GitHub masks
          # the secret values in logs.
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          # Retry only transient ticket-download errors after Apple accepted
          # the submission; rejection, signing and validation failures stop.
          for attempt in 1 2 3; do
            if output=$(xcrun stapler staple "$DMG" 2>&1); then
              printf '%s\n' "$output"
              break
            else
              status=$?
              printf '%s\n' "$output" >&2
            fi
            if (( attempt == 3 )) || ! grep -Eq 'NSURLErrorDomain Code=-(1001|1005|1009)([^0-9]|$)' <<< "$output"; then
              exit "$status"
            fi
            sleep "$((attempt * 5))"
          done
          xcrun stapler validate "$DMG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-native
          path: native-dist/*
          if-no-files-found: error
          retention-days: 3
  native-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop-native/go.mod
          cache-dependency-path: |
            go.sum
            desktop-native/go.sum
      - name: Build and validate the Linux native packages
        env:
          TAG: ${{ needs.validate.outputs.version }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          # Stage outside the repository: the second build's clean-checkout
          # would reject the first build's untracked artifacts otherwise.
          bash scripts/build-native.sh linux-amd64 /tmp/native-dist "$TAG"
          bash scripts/build-native.sh linux-arm64 /tmp/native-dist "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-native-linux
          path: /tmp/native-dist/*
          if-no-files-found: error
          retention-days: 3
  android:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Persist incremental build results for consecutive PR pushes; tag
          # builds only read caches, since their immutable refs are not reused.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
      - name: Install the pinned Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
      - name: Build and verify the signed Android APK
        env:
          TAG: ${{ needs.validate.outputs.version }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/build-android.py build dist --version "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 3
  publish:
    # Builds share only the validated revision, not each other's outputs.
    # The publication barrier still requires every test and functional check.
    needs: [validate, verify, android-ui, core, native, native-linux, native-windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Assemble complete manifest and verify every asset
        run: |
          python3 scripts/release.py validate "$TAG"
          python3 scripts/release.py manifest "$TAG" "$RELEASE_SHA" dist
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish complete draft without replacing published assets
        run: python3 scripts/publish-release.py "$TAG" "$RELEASE_SHA" dist
