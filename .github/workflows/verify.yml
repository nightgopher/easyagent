name: Verify
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...
      - run: go vet ./...
      - run: go test ./...
        working-directory: third_party/bubbletea
      - run: node --test scripts/web-test.mjs scripts/mcp-settings-test.mjs
      - run: python3 scripts/test_update_mini.py
      - run: python3 scripts/test_desktop_registration.py
      - run: python3 -m unittest discover -s scripts -p "test_release*.py"
      - uses: actions/setup-java@v4
        if: ${{ hashFiles('mobile-native/gradlew') != '' }}
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile-native/**/*.gradle.kts
            mobile-native/gradle/wrapper/gradle-wrapper.properties
      - name: Test, lint and build the Android client
        if: ${{ hashFiles('mobile-native/gradlew') != '' }}
        working-directory: mobile-native
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - run: git diff --check
