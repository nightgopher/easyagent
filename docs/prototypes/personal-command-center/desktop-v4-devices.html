<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>EasyAgent · 目标 × 设备 原型 v4</title>
<style>
:root{
  --bg:#131718;--elev:#181d1f;--raised:#1e2426;--sunken:#0e1112;
  --ink:#edf2f0;--muted:#9aa8a3;--dim:#6b7a75;--accent:#4ecdc4;--accent-ink:#081a17;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --warn:#f0b95a;--danger:#ef7d7d;--ok:#6ee7b7;--violet:#a99cf5;--blue:#7cb7f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:ui-monospace,Menlo,monospace}
.grow{flex:1}
/* titlebar */
.titlebar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--elev)}
.lights{display:flex;gap:7px;margin-right:6px}.lights i{width:11px;height:11px;border-radius:50%;background:#3a4244}
.brandmark{color:var(--accent);font-size:20px;font-weight:600;line-height:1}
.vsep{width:1px;height:16px;background:var(--line2);margin:0 4px}
.crumb{color:var(--muted);display:flex;align-items:center;gap:6px}.crumb b{color:var(--ink);font-weight:500}
.hostpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:12px}
/* layout */
.body{flex:1;display:grid;grid-template-columns:250px 1fr;overflow:hidden}
.side{background:var(--elev);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sidescroll{flex:1;overflow:auto;padding:10px 8px}
.nav{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--muted);width:100%;text-align:left;min-width:0}
.nav:hover{background:var(--raised);color:var(--ink)}
.nav.on{background:var(--raised);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.nav .ic{width:16px;text-align:center;flex:none}
.nav .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .badge{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-weight:600}
.nav .meta{font-size:11px;color:var(--dim);flex:none}
.nav.child{padding-left:26px;font-size:12.5px}
.sec{font-size:11px;color:var(--dim);padding:14px 8px 4px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--dim);font-size:14px}.sec button:hover{color:var(--ink)}
.caret{width:12px;color:var(--dim);font-size:9px;flex:none;transition:transform .15s;display:inline-block}
.caret.open{transform:rotate(90deg)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid;display:inline-block;flex:none}
.sidefoot{padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.sidefoot .srcs{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sidefoot .srcs span{display:inline-flex;gap:4px;align-items:center}
/* main */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.scroll{flex:1;overflow:auto}
.wrap{max-width:860px;margin:0 auto;padding:22px 26px 40px}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pagehead h1{font-size:19px;font-weight:600}
.sub{color:var(--muted);font-size:12px}
.btn{padding:6px 12px;border-radius:7px;background:var(--raised);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--raised)}
.btn.sm{padding:3px 9px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;font-weight:500;white-space:nowrap}
.t-result{background:rgba(124,183,240,.14);color:var(--blue)}
.t-close{background:rgba(110,231,183,.14);color:var(--ok)}
.t-orphan{background:rgba(169,156,245,.14);color:var(--violet)}
.t-stuck{background:rgba(239,125,125,.14);color:var(--danger)}
.t-approve{background:rgba(240,185,90,.14);color:var(--warn)}
.t-suggest{background:rgba(78,205,196,.14);color:var(--accent)}
.t-stale{background:rgba(255,255,255,.06);color:var(--muted)}
.tool{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--raised);border-radius:4px;padding:1px 6px;white-space:nowrap}
.spl{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:10px;white-space:nowrap}
.s-todo{background:rgba(255,255,255,.06);color:var(--muted)}
.s-active{background:rgba(78,205,196,.12);color:var(--accent)}
.s-review{background:rgba(124,183,240,.14);color:var(--blue)}
.s-stuck{background:rgba(239,125,125,.14);color:var(--danger)}
.s-done{background:rgba(110,231,183,.12);color:var(--ok)}
.brief{background:linear-gradient(135deg,rgba(78,205,196,.10),rgba(78,205,196,.02));border:1px solid rgba(78,205,196,.22);border-radius:12px;padding:14px 18px;margin:14px 0 18px}
.brief .h{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.brief .h span{font-size:11px;color:var(--muted);font-weight:400}
.brief li{list-style:none;color:var(--muted)}.brief b{color:var(--ink);font-weight:500}
.card{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;transition:opacity .25s,transform .25s}
.card:hover{border-color:var(--line2)}
.card.out{opacity:0;transform:translateX(30px)}
.card.new{animation:pop .6s}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.card .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.card .time{margin-left:auto;font-size:11px;color:var(--dim)}
.card .title{font-size:14px;font-weight:500;margin-bottom:3px}
.card .goalref{font-size:12px;color:var(--muted);margin-bottom:6px;cursor:pointer}
.card .goalref:hover{color:var(--accent)}
.card .desc{color:var(--muted);margin-bottom:10px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--dim);padding:50px 0}
.lbl{font-size:11px;color:var(--dim);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.lbl .r{margin-left:auto}
.panel{background:var(--elev);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer}.row.click:hover{background:var(--raised)}
.row .tt{flex:1;min-width:0}.row .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .b{font-size:11px;color:var(--dim)}
.row.hl{background:rgba(124,183,240,.06);box-shadow:inset 2px 0 0 var(--blue)}
.kind{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:12px;background:var(--raised)}
/* goal page */
.goalgrid{display:grid;grid-template-columns:1fr 250px;gap:22px;max-width:1080px;margin:0 auto;padding:22px 26px 40px}
.what{color:var(--muted);line-height:1.8;margin-top:10px}
.crit{display:flex;align-items:flex-start;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;cursor:pointer}
.box.on{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.crit .by{font-size:11px;color:var(--dim)}
.crit.just{animation:flash 1.4s}
@keyframes flash{0%{background:rgba(110,231,183,.25)}100%{background:none}}
.procs{display:none}
.procs.open{display:block}
.side2 .blk{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.side2 .blk h4{font-size:11px;color:var(--dim);font-weight:400;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0}
.kv b{color:var(--ink);font-weight:500}
.tl{font-size:12px;color:var(--muted);border-left:1px solid var(--line2);margin-left:4px;padding-left:12px}
.tl div{position:relative;padding:3px 0}
.tl div::before{content:'';position:absolute;left:-16px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.tl div.k::before{background:var(--accent)}
.tl span{color:var(--dim);font-size:11px;margin-right:6px}
.prog{height:5px;background:var(--sunken);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .6s}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;padding:20px 22px;min-width:960px}
.col h3{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:8px;display:flex;gap:6px;align-items:center}
.gcard{background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.gcard:hover{border-color:var(--line2)}
.gcard .gt{font-size:13px;margin-bottom:6px}
.gcard .gm{display:flex;gap:8px;font-size:11px;color:var(--dim);align-items:center}
/* chat */
.chathead{flex:none;padding:10px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.msgs{max-width:760px;margin:0 auto;padding:20px 26px}
.m{margin-bottom:16px}
.m.user{display:flex;justify-content:flex-end}
.m.user .bub{background:var(--raised);border:1px solid var(--line);padding:9px 13px;border-radius:12px 12px 4px 12px;max-width:80%}
.m.ai .who{color:var(--accent);font-weight:600;font-size:15px;margin-bottom:3px}
.m.ai p{line-height:1.75;margin-bottom:6px}
.m.ai ul{margin:0 0 6px 20px}
.composer{max-width:760px;margin:0 auto 16px;background:var(--raised);border:1px solid rgba(78,205,196,.32);border-radius:12px;padding:10px 13px 8px;width:calc(100% - 52px)}
.composer textarea{width:100%;background:none;border:none;outline:none;resize:none;font-size:14px;min-height:40px}
.cbar{display:flex;align-items:center;gap:6px}
.send{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.notice{max-width:760px;margin:0 auto 10px;width:calc(100% - 52px);border:1px dashed rgba(78,205,196,.4);border-radius:9px;padding:9px 12px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;background:rgba(78,205,196,.04)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:6}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:9vh;transform:translate(-50%,-10px);width:640px;max-height:82vh;overflow:auto;background:var(--elev);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:7}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center}
.pack{background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font:12px/1.75 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted);max-height:170px;overflow:auto}
.pack b{color:var(--ink)}
.tools4{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tb4{border:1px solid var(--line);border-radius:9px;padding:9px 6px;text-align:center;background:var(--raised);font-size:12px}
.tb4.on{border-color:var(--accent);background:rgba(78,205,196,.07)}
.tb4 .i{font-size:16px;font-weight:600;display:block}
.inp{width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:8px;outline:none;padding:8px 11px}
.menu{position:absolute;background:var(--elev);border:1px solid var(--line2);border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.45);padding:5px;z-index:8;min-width:240px}
.menu button{display:flex;width:100%;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;text-align:left}
.menu button:hover{background:var(--raised)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--raised);border:1px solid var(--line2);border-radius:9px;padding:9px 16px;opacity:0;transition:.25s;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.devgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dev{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.dev.hub{border-color:rgba(78,205,196,.45)}
.dev .dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dev .dn{font-weight:600;font-size:14px}
.dev .os{font-size:11px;color:var(--dim)}
.dev .now{font-size:12px;color:var(--muted);background:var(--raised);border-radius:6px;padding:6px 8px;margin:8px 0;min-height:32px;cursor:pointer}
.dev .caps{display:flex;gap:4px;flex-wrap:wrap}
.cap{font-size:10.5px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.05);color:var(--muted)}
.devb{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 6px;white-space:nowrap}
.need{font-size:10.5px;color:var(--warn);border:1px solid rgba(240,185,90,.35);border-radius:4px;padding:0 5px;margin-left:6px}
.devpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:left;background:var(--raised);font-size:12px}
.dp.on{border-color:var(--accent);background:rgba(78,205,196,.07)}
.dp.off{opacity:.45}
.dp .rec{font-size:10px;color:var(--accent);float:right}
.dp .why{font-size:10.5px;color:var(--dim);margin-top:2px}
.hstep{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.hstep .n{width:18px;height:18px;border-radius:50%;background:var(--raised);font-size:11px;display:grid;place-items:center;flex:none;margin-top:1px}
.hstep.ok .n{background:var(--ok);color:var(--accent-ink)}
.legend{position:fixed;right:14px;bottom:14px;width:260px;background:rgba(14,17,18,.96);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--muted);z-index:5;line-height:1.75}
.legend b{color:var(--ink)}
.legend .x{float:right;color:var(--dim);cursor:pointer}
</style>
</head>

function act(e,id,a){
  const n=inbox.find(x=>x.id===id);
  if(a==='goal')return go({k:'goal',id:n.g});

  if(a==='takeover'){rm(id);return openHandoff(12,'lx',true)}

  if(a==='attach'){popMenu(e,goals.filter(g=>g.sp==='easyagent'&&g.st!=='done').map(g=>`<button onclick="attachOrphan(${g.id})">${ringFor(g)} #${g.id} ${g.t}</button>`).join(''))}
}

    <div class="lbl">结果 · ${g.res.length}<span class="r">来自哪台机器、哪个工具都行</span></div>
    <div class="panel">${res}</div>
    <div class="lbl"><button class="btn sm ghost" style="padding-left:0" onclick="this.closest('.lbl').nextElementSibling.classList.toggle('open')">▸ </button>过程 · ${g.procs.length} 个会话，分布在 ${[...new Set(g.procs.map(p=>DEV[p[1]].n))].join(' / ')||'—'}<span class="r">只读 · 不需要你维护</span></div>
    <div class="procs"><div class="panel">${g.procs.map(p=>`<div class="row click" onclick="toast('通过 Tailscale 打开 ${DEV[p[1]].n} 上的 ${TOOLS[p[0]].n} 会话')"><span style="color:${TOOLS[p[0]].c};width:24px;text-align:center;font-weight:600">${TOOLS[p[0]].i}</span><div class="tt"><div class="a">${p[2]}</div><div class="b">${DEV[p[1]].n} · ${TOOLS[p[0]].n} · ${p[3]}</div></div><span class="sub">打开 ↗</span></div>`).join('')||'<div class="row sub">没有关联的会话</div>'}</div></div>
  </div>
  <div class="side2">
    <div class="blk"><h4>进度</h4><div style="font-size:22px;font-weight:600">${pct(g)}%</div><div class="prog"><i style="width:${pct(g)}%"></i></div></div>
    <div class="blk"><h4>开工 / 交接时会带上</h4><div class="kv"><span>目标 + 完成标准</span><b>✓</b></div><div class="kv"><span>已有结果摘要</span><b>${g.res.length}</b></div><div class="kv"><span>最近的交接说明</span><b>${g.res.some(r=>r.k==='handoff')?'✓':'—'}</b></div><div class="kv"><span>历史会话</span><b style="color:var(--dim)">不带</b></div></div>
    <div class="blk"><h4>动态</h4><div class="tl">${g.tl.map(([w,t,k])=>`<div class="${k?'k':''}"><span>${w}</span>${t}</div>`).join('')||'<span class="sub">暂无</span>'}</div></div>
  </div></div></div>`;
}
function resActs(g,r,ix){
  if(r.k==='pr'&&r.s.includes('待合并'))return `<button class="btn sm pri" onclick="merge11();inbox=inbox.filter(x=>x.id!=='a');render()">合并</button>`;
  if(r.k==='mail'&&r.s.includes('等你'))return `<button class="btn sm pri" onclick="act(event,'b','mail')">允许发送</button>`;
  if(r.k==='handoff')return `<button class="btn sm" onclick="toast('交接说明：进度 / 下一步 / 注意事项')">查看</button>`;
  return '';
}
function toggleCrit(gid,ix){const g=G(gid);g.crit[ix].ok=!g.crit[ix].ok;g.crit[ix].by=g.crit[ix].ok?'你手动勾选':'';if(g.crit.every(c=>c.ok)){g.st='done';toast('标准全部满足，目标完成')}else if(g.st==='done')g.st='active';render()}

/* ---------- 选设备 ---------- */
function recDev(g,hint){
  const need=g.crit.find(c=>c.need&&!c.ok);
  if(startDev)return startDev;
  if(need)return need.need;
  if(/压测|长任务|测试/.test(g.t))return 's1';
  return Object.keys(DEV).find(k=>!DEV[k].hub&&DEV[k].st==='online'&&DEV[k].kind==='开发机');
}
function devPicker(sel,from,onpick){
  return `<div class="devpick">${Object.entries(DEV).filter(([k,d])=>!d.hub).map(([k,d])=>{
    const off=d.st==='offline'||k===from;
    const why=k===from?'当前所在':d.st==='busy'?'忙：'+(d.now?'#'+d.now.g:''):d.caps[0]||'空闲';
    return `<button class="dp ${sel===k?'on':''} ${off?'off':''}" ${off?'disabled':''} onclick="${onpick}('${k}')">${sel===k?'<span class="rec">已选</span>':''}<b>${d.ic} ${d.n}</b><div class="why">${d.os} · ${why}</div></button>`}).join('')}</div>`;
}

/* ---------- 开工 ---------- */
let startCtx={};
function openStart(gid,hint){
  const g=G(gid);startCtx={gid,hint};
  const dev=recDev(g,hint);startDev=dev;
  if(!DEV[dev].tools.includes(startTool))startTool=DEV[dev].tools[0];
  const branch=`goal/${gid}-${g.t.replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase().replace(/^-|-$/g,'')||'work'}`;
  $('modal').innerHTML=`<div class="mb"><div style="font-weight:600;font-size:15px">开工：#${g.id} ${g.t}</div>
    <div class="sub" style="margin:4px 0 12px">${hint?'💡 '+hint:'选一台机器、一个工具。EasyAgent 把目标打包带过去，结果自动收回来。'}</div>
    <div class="lbl" style="margin-top:0">在哪台机器</div>${devPicker(dev,null,'pickStartDev')}
    <div class="lbl">用什么工具（${DEV[dev].n} 上已安装的）</div>
    <div class="tools4">${DEV[dev].tools.map(k=>`<button class="tb4 ${startTool===k?'on':''}" onclick="startTool='${k}';openStart(${gid},startCtx.hint)"><span class="i" style="color:${TOOLS[k].c}">${TOOLS[k].i}</span>${TOOLS[k].n}</button>`).join('')}</div>
    <div class="lbl">开工包</div>
    <div class="pack"><b># 目标 #${g.id}：${g.t}</b>
${g.crit.map(c=>(c.ok?'- [x] ':'- [ ] ')+c.t).join('\n')}

<b>## 已有结果</b>
${g.res.map(r=>'- '+r.t+'（'+(DEV[r.dev]?DEV[r.dev].n+' · ':'')+r.s+'）').join('\n')||'- 暂无'}
${g.res.filter(r=>r.k==='handoff').map(r=>'\n<b>## 上一手的交接说明</b>\n'+r.note).join('')}
<b>## 约定</b>
- 分支 ${branch}，PR 写 Closes #${g.id}</div></div>
    <div class="mf"><span class="sub">中枢通过 Tailscale 让 ${DEV[dev].n} 拉取分支并启动 ${TOOLS[startTool].n}</span><span class="grow"></span><button class="btn ghost" onclick="closeAll()">取消</button><button class="btn pri" onclick="doStart(${gid})">在 ${DEV[dev].n} 上开工</button></div>`;
  $('modal').classList.add('on');$('scrim').classList.add('on');
}
function pickStartDev(k){startDev=k;openStart(startCtx.gid,startCtx.hint)}
function doStart(gid){
  closeAll();const g=G(gid),d=DEV[startDev];
  g.procs.unshift([startTool,startDev,'开工：'+g.t,'刚刚']);g.tl.unshift(['刚刚',`派到 ${d.n} · ${TOOLS[startTool].n}`,1]);
  if(g.st==='todo'||g.st==='stuck')g.st='active';g.dev=startDev;d.st='busy';d.now={g:gid,tool:startTool,t:'开工'};
  render();toast(`${d.n} 已拉取分支并打开 ${TOOLS[startTool].n}${d.kind==='服务器'?'；服务器上的长任务不需要你盯着':''}`);startDev=null;
}

/* ---------- 交接 ---------- */
let hoTo=null;
function openHandoff(gid,to,auto){
  const g=G(gid),from=g.dev;hoTo=to||Object.keys(DEV).find(k=>k!==from&&!DEV[k].hub&&DEV[k].st==='online');
  const steps=auto?[[1,`${DEV[from].n} 合盖前，未提交的 3 个文件已推成 WIP 提交`],[1,'Codex 会话最后的状态已整理成交接说明'],[0,`在 ${DEV[hoTo].n} 上拉取 WIP 分支并接着干`]]
    :[[0,`在 ${DEV[from].n} 上把未提交改动推成 WIP 提交（3 个文件）`],[0,`让 ${DEV[from].n} 上的 Codex 写交接说明：进度 / 下一步 / 坑`],[0,`在 ${DEV[hoTo].n} 上拉取分支，带着开工包 + 交接说明开工`]];
  $('modal').innerHTML=`<div class="mb"><div style="font-weight:600;font-size:15px">${auto?'接手':'交接'}：#${g.id} ${g.t}</div>
    <div class="sub" style="margin:4px 0 12px">git 负责搬代码，目标负责搬上下文。不同步会话。</div>
    <div class="lbl" style="margin-top:0">从 ${devB(from)} 交给</div>${devPicker(hoTo,from,'pickHoDev')}
    <div class="lbl">会发生什么</div>${steps.map(([ok,t],i)=>`<div class="hstep ${ok?'ok':''}"><span class="n">${ok?'✓':i+1}</span><div>${t}</div></div>`).join('')}
    <div class="lbl">交接说明（${auto?'已生成':'预览'}，会作为结果挂到目标上）</div>
    <div class="pack"><b>进度</b>：审批按钮 UI 完成，调用 /sessions/{id}/approve 已接通
<b>下一步</b>：处理审批超时后的状态回滚；补 ViewModel 单测
<b>注意</b>：Compose 预览在 mac 上崩溃是 AGP 版本问题，lx-dev 上没有
<b>分支</b>：goal/12-mobile-approve（WIP 提交 a3f9e1c）</div></div>
    <div class="mf"><span class="grow"></span><button class="btn ghost" onclick="closeAll()">取消</button><button class="btn pri" onclick="doHandoff(${gid},'${from}')">${auto?'在 '+DEV[hoTo].n+' 上接手':'交接到 '+DEV[hoTo].n}</button></div>`;
  $('modal').classList.add('on');$('scrim').classList.add('on');
  openHandoff._auto=auto;
}
function pickHoDev(k){hoTo=k;const g=G(view.k==='goal'?view.id:12);openHandoff(g.id,k,openHandoff._auto)}
function doHandoff(gid,from){
  closeAll();const g=G(gid);
  g.res.unshift({k:'handoff',t:`交接说明：${DEV[from].n} → ${DEV[hoTo].n}`,tool:'codex',dev:from,s:'WIP a3f9e1c',sc:'var(--muted)',when:'刚刚',note:'进度：审批按钮 UI 完成…\n下一步：审批超时回滚…'});
  g.tl.unshift(['刚刚',`交接 ${DEV[from].n} → ${DEV[hoTo].n}`,1]);g.dev=hoTo;
  if(DEV[from].now&&DEV[from].now.g===gid){DEV[from].now=null;if(DEV[from].st!=='offline')DEV[from].st='online'}
  DEV[hoTo].st='busy';DEV[hoTo].now={g:gid,tool:'claude',t:'接手：'+g.t};g.procs.unshift(['claude',hoTo,'接手：'+g.t,'刚刚']);
  go({k:'goal',id:gid});toast(`${DEV[hoTo].n} 已拉取 WIP 分支，Claude Code 带着交接说明开工`);
}

/* ---------- 新目标 / 随手聊 ---------- */
function mkGoal(sp,t,what){const g={id:nextG++,sp,t,st:'todo',due:'',dev:null,what,crit:[{t:t+' 可用并有测试',ok:false}],res:[],procs:[],tl:[['刚刚','创建目标',0]]};goals.push(g);openSp[sp]=true;return g}
function newGoal(sp){
  sp=sp||'easyagent';
  $('modal').innerHTML=`<div class="mb"><div style="font-weight:600;font-size:15px;margin-bottom:12px">新目标</div>
  <input class="inp" id="gt" placeholder="想要什么结果？例如：Windows 安装包" style="font-size:14px">
  <div class="lbl">空间</div><select class="inp" id="gsp">${Object.entries(SP).map(([k,s])=>`<option value="${k}" ${k===sp?'selected':''}>${s.n}</option>`).join('')}</select>
  <div class="lbl">完成标准（EasyAgent 起草，识别出需要特定系统的步骤）</div>
  <div class="pack" id="gc" style="font-family:inherit">输入标题后自动起草…</div></div>
  <div class="mf"><span class="grow"></span><button class="btn ghost" onclick="closeAll()">取消</button><button class="btn pri" onclick="submitGoal()">创建</button></div>`;
  $('modal').classList.add('on');$('scrim').classList.add('on');$('gt').focus();
  $('gt').oninput=()=>{const v=$('gt').value.trim();const w=/windows/i.test(v)?'win':/mac|苹果/i.test(v)?'mac':null;$('gc').innerHTML=v?`☐ ${v} 的核心功能可用<br>☐ 有测试覆盖${w?`<br>☐ 在 ${DEV[w].os} 上验证 <span class="need">需要 ${DEV[w].n}</span>`:''}`:'输入标题后自动起草…'};
}
function submitGoal(){const t=$('gt').value.trim()||'Windows 安装包';const w=/windows/i.test(t)?'win':/mac|苹果/i.test(t)?'mac':null;const g=mkGoal($('gsp').value,t,'');g.crit=[{t:t+' 的核心功能可用',ok:false},{t:'有测试覆盖',ok:false}];if(w)g.crit.push({t:`在 ${DEV[w].os} 上验证`,ok:false,need:w});closeAll();go({k:'goal',id:g.id})}
function vChat(){
  const c=chats.find(x=>x.id===view.id);
  return `<div class="chathead"><b>${c?c.t:'新会话'}</b><span class="grow"></span><span class="sub">mini · coding</span></div>
  <div class="scroll"><div class="msgs">${c?`<div class="m user"><div class="bub">${c.t}</div></div><div class="m ai"><div class="who">ea·</div><p>（现有对话界面，不变）</p></div>`:'<div class="empty">新会话 · 和现在的 EasyAgent 对话一样</div>'}</div></div>
  <div class="composer"><textarea placeholder="发送消息，输入 / 查看命令…"></textarea><div class="cbar"><span class="sub">随手聊不属于任何目标</span><span class="grow"></span><button class="send">↑</button></div></div>`;
}

/* ---------- misc ---------- */
function popMenu(e,html){closeMenu();const m=document.createElement('div');m.className='menu';m.id='menu';m.innerHTML=html;document.body.appendChild(m);const r=e.currentTarget.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-260)+'px';m.style.top=(r.bottom+6)+'px';e.stopPropagation()}
function closeMenu(){$('menu')?.remove()}
document.addEventListener('click',closeMenu);
function closeAll(){['modal','scrim'].forEach(i=>$(i).classList.remove('on'))}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAll();closeMenu()}});
// 演示：srv-1 压测进度
setInterval(()=>{const d=DEV.s1;if(d.now&&d.now.g===10){const m=d.now.t.match(/(\d+)\/50/);if(m&&+m[1]<50){d.now.t=`重连用例压测 ${+m[1]+1}/50 轮`;const n=inbox.find(x=>x.id==='s');if(n)n.title=`srv-1 正在压测重连用例：${+m[1]+1}/50 轮，已复现 2 次超时`;if(!document.querySelector('.modal.on'))render()}}},3000);
// 演示：mac 合盖离线 → 自动交接包进收件箱
setTimeout(()=>{
  const d=DEV.mac;d.st='offline';d.now=null;
  const g=G(12);g.tl.unshift(['刚刚','mac 离线；未提交改动已推成 WIP，交接说明已生成',1]);
  inbox.unshift({id:'ho',type:'suggest',g:12,dev:'mac',tt:'可接手',title:'mac 合盖离线了，#12 留下了交接包',desc:'离线前未提交的 3 个文件已推成 WIP 提交，Codex 会话的进度整理成了交接说明。lx-dev 空闲，也能做 Android 构建。',time:'刚刚',acts:[['在 lx-dev 上接手','takeover',1],['等 mac 回来','drop:好的，mac 上线后提醒你']]});
  if(!document.querySelector('.modal.on'))render();document.querySelector('#c-ho')?.classList.add('new');toast('mac 离线 · 已自动留下 #12 的交接包');
},8000);
render();
</script>
</body>
</html>
